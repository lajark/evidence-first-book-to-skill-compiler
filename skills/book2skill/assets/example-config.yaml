# Book2Skill 用户起步配置模板
#
# 用途：把本文件复制为 config.local.yaml 并按需修改，再用
#   book2skill analyze <sources> --config config.local.yaml
# 等方式加载（配置加载为 P1 增强，当前 CLI flags 优先级高于配置文件）。
#
# 所有字段都有默认值；只覆盖需要调整的部分即可。

schema_version: 1

# 输出语言：CLI、错误、报告与生成模板支持的语言
language: zh-CN

# 默认数据根目录：Raw / Schema / Wiki / snapshots 都在此目录下
# 默认 ./workspace；可指向仓库外以避免被 Git 跟踪
data_home: ./workspace

# 默认模式：analyze | build | build-from-analysis | update
default_mode: analyze

# 网络与云 LLM：默认离线、无遥测；云模型必须显式 opt-in
network: disabled
cloud_llm:
  enabled: false
  base_url: null        # 例：https://api.openai.com/v1（启用时填）
  model: null           # 例：gpt-4o-mini
  api_key_env: null     # 仅从环境变量读取，不写入本文件

# 输入合法性上限
limits:
  max_input_mb: 200           # 单文件大小上限
  max_direct_quote_words: 25  # 直接引文软上限（PRD FR-08），中文按 1.5 字符/词折算
  skill_target_tokens: 4000   # SKILL.md 目标 token（目标区间 2500–5000）
  reference_target_tokens: 1500

# 已启用的部署宿主（用于 install/uninstall 命令的 --host 选项校验）
hosts:
  - claude
  - trae
  - codex
  - project

# 可选依赖分组（pyproject.toml [project.optional-dependencies] 对应）
# 缺失时输出降级说明与安装命令，不阻塞其他格式
optional_extras:
  pdf: [pymupdf, pypdf, pdfminer.six]
  epub: [ebooklib, beautifulsoup4]
  docx: [python-docx]
  html: [beautifulsoup4]
  mobi: [calibre-cli]   # 外部 CLI，非 PyPI 依赖
