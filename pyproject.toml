[project]
name = "book2skill"
dynamic = ["version"]
description = "Compile legally-owned books and documents into portable Agent Skills."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "See LICENSE" }
authors = [
    { name = "Book2Skill Contributors" },
]
keywords = ["skill", "agent", "book", "pdf", "epub", "markdown"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
pdf = [
    "pymupdf>=1.24,<2",
    "pypdf>=4.0,<5",
    "pdfminer.six>=20231228",
]
epub = [
    "ebooklib>=0.18,<1",
    "beautifulsoup4>=4.12,<5",
]
docx = ["python-docx>=1.1,<2"]
html = ["beautifulsoup4>=4.12,<5"]
mobi = []  # Calibre CLI is used externally; no PyPI dependency
docling = ["docling>=2.25,<3"]  # optional layout-aware PDF backend (heavy)
ocr = ["pillow>=10.3,<11"]
llm = ["openai>=1.30,<2"]
desktop = [
    "pywebview>=5.1,<6",
]
# Safe standard desktop profile.  It intentionally omits PyMuPDF (AGPL or
# commercial terms) until the external-distribution license decision is made.
desktop-safe = [
    "pywebview>=5.1,<6",
    "pypdf>=4.0,<5",
    "pdfminer.six>=20231228",
    "beautifulsoup4>=4.12,<5",
    "python-docx>=1.1,<2",
    "openai>=1.30,<2",
]
build-windows = [
    "pyinstaller>=6.10,<7",
]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-pyyaml>=6.0,<7",
    "jsonschema>=4.22,<5",
]

[project.scripts]
book2skill = "book2skill.cli:app"
book2skill-desktop = "book2skill.desktop.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/book2skill/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/book2skill"]

[tool.hatch.build.targets.wheel.force-include]
"templates/generated-skill" = "book2skill/_resources/templates/generated-skill"
"schemas" = "book2skill/_resources/schemas"

[tool.hatch.build.targets.sdist]
skip-excluded-dirs = true
exclude = [
    "/.workspace",
    "/workspace",
    "/output",
    "/input",
    "/dist",
    "/.venv",
    "/htmlcov",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "/.coverage",
    "/.env",
    "/.env.*",
    "/config.local.*",
    "/llm-profiles.local.*",
    "/AGENTS.md",
    "/CLAUDE*",
    "/ACCEPTANCE_TEST_PLAN.md",
    "/GITEE_PRIVATE_REPO.md",
    "/IMPLEMENTATION_PLAN.md",
    "/PACKAGE_MANIFEST.md",
    "/PRD.md",
    "/TASKS.md",
    "/docs/INTEGRATION_REVIEW.md",
    "/docs/M6_ACCEPTANCE_REPORT.md",
    "/docs/P1_ACCEPTANCE_BENCHMARK_BASELINE.md",
    "/docs/P2_PLATFORM_BASELINE.md",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = ["UP017"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["book2skill"]

[tool.ruff.lint.per-file-ignores]
# Selectively-ported upstream code keeps its original form; lint is not the
# source of truth for vendored files (provenance headers document changes).
"src/book2skill/extractors/_vendor/**/*.py" = ["E501", "B904", "I001", "F401"]
# Typer's API requires calling Argument/Option in parameter defaults.
"src/book2skill/cli.py" = ["B008"]
"src/book2skill/extensions/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["book2skill"]
show_error_codes = true
warn_unused_ignores = true
exclude = [
    # Selectively-ported upstream code is not type-checked by this project;
    # provenance headers document origin and modifications.
    "src/book2skill/extractors/_vendor/.*",
]

# Optional format-backends ship without py.typed markers; suppress the
# ``import-untyped`` error so the type-checker does not require stubs.
[[tool.mypy.overrides]]
module = [
    "fitz",
    "pypdf",
    "pdfminer.*",
    "ebooklib.*",
    "docx",
    "bs4.*",
    "jsonschema",
    "openai",
    "webview",
]
ignore_missing_imports = true

# Imported selectively-ported modules must remain outside the strict type
# checking boundary as well as outside recursive module discovery.
[[tool.mypy.overrides]]
module = ["book2skill.extractors._vendor.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --cov=book2skill --cov-report=term-missing --cov-report=html"
markers = [
    "slow: marks tests as slow",
    "network: marks tests that require network access",
]
